.wrap{position:relative;z-index:2;flex:1 0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 14px);min-height:0}

/* ブランド（名刺と同じ構成） */
.brand{text-align:center;flex:0 0 auto}
.brand .eyebrow{font-family:var(--logo);font-weight:600;font-size:9.5px;letter-spacing:.34em;
  color:#bcd0ff;padding-left:.34em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.brand .logo{font-family:var(--logo);font-weight:800;font-size:38px;letter-spacing:.06em;line-height:1.05;
  color:#fff;margin-top:6px;text-shadow:var(--glow)}
.brand .sub{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.16em;
  color:#cfe0ff;margin-top:7px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.brand .sub b{font-family:var(--logo);font-weight:600;letter-spacing:.12em}

/* 動画（大きく・ほぼ全幅） */
.videocard{flex:0 0 auto;margin:16px -16px 0;position:relative;overflow:hidden;
  aspect-ratio:16/9;background:#05070f;
  box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(63,131,255,.25);
  border-top:1px solid rgba(120,170,255,.35);border-bottom:1px solid rgba(120,170,255,.28)}
.videocard video{width:100%;height:100%;object-fit:cover;display:block}
.sound{position:absolute;top:10px;right:11px;display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px 5px 8px;border:none;border-radius:999px;cursor:pointer;
  background:rgba(11,17,48,.55);backdrop-filter:blur(6px);color:#fff;
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.05em;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.sound svg{width:13px;height:13px}

.spacer{flex:1 1 auto;min-height:12px}

/* 連絡先（ダークすりガラス） */
.glass{flex:0 0 auto;margin-top:14px;border-radius:22px;padding:16px 14px 15px;
  background:linear-gradient(180deg,rgba(23,30,66,.74),rgba(11,16,40,.82));
  backdrop-filter:blur(18px) saturate(140%);
  border:1px solid rgba(140,170,255,.22);box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.glass .cta-h{text-align:center;font-family:var(--logo);font-weight:700;font-size:11px;letter-spacing:.22em;
  color:#a9c0ff;margin-bottom:12px}
.glass .cta-h::before,.glass .cta-h::after{content:"";display:inline-block;width:22px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(140,170,255,.6));vertical-align:middle;margin:0 8px}
.glass .cta-h::after{background:linear-gradient(90deg,rgba(140,170,255,.6),transparent)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 11px;
  box-shadow:0 3px 10px rgba(0,0,0,.25);transition:transform .12s ease,background .2s ease}
.tile:active{transform:scale(.97)}
.tile .ic{flex:0 0 auto;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;
  box-shadow:0 3px 9px rgba(0,0,0,.35)}
.tile .ic svg{width:20px;height:20px}
.tile .tx{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.tile .t1{font-size:12.5px;font-weight:800;letter-spacing:.02em}
.tile .t2{font-size:9.5px;color:var(--muted);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ic-fb{background:#1877F2}
.ic-tt{background:#000;border:1px solid rgba(255,255,255,.18)}
.ic-ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.ic-line{background:#06C755}

/* 代表者 */
.rep{text-align:center;margin-bottom:11px}
.rep .role{display:inline-block;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.28em;
  color:#0b1130;background:#bcd0ff;padding:2px 9px;border-radius:999px;margin-bottom:6px}
.rep .name{font-family:var(--sans);font-weight:800;font-size:19px;letter-spacing:.06em;color:#fff}
.rep .name-en{font-family:var(--logo);font-weight:600;font-size:9px;letter-spacing:.22em;color:#9fb0d6;margin-top:2px}
.rep .addr{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#c4d2f2;margin-top:8px;letter-spacing:.02em}
.rep .addr svg{width:11px;height:11px;flex:0 0 auto;color:#7fa2ff}

/* tel / mail ワンタップ */
.hpcta{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,#4a90ff,#2b5fd6);border-radius:14px;padding:11px 13px;margin-bottom:9px;
  box-shadow:0 8px 20px rgba(43,95,214,.45);position:relative;overflow:hidden}
.hpcta::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-40%}85%,100%{left:130%}}
.hpcta .ic{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.hpcta .ic svg{width:20px;height:20px}
.hpcta .tx{display:flex;flex-direction:column;line-height:1.25}
.hpcta .t1{font-size:14px;font-weight:900;letter-spacing:.03em}
.hpcta .t2{font-size:9.5px;opacity:.9;letter-spacing:.03em;font-family:var(--logo);font-weight:600}
.hpcta .arrow{margin-left:auto;font-size:17px;font-weight:900}

.leads{display:flex;flex-direction:column;gap:8px;margin-bottom:13px}
.lead-btn{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:9px 12px;
  box-shadow:0 3px 10px rgba(0,0,0,.28);transition:transform .12s ease}
.lead-btn:active{transform:scale(.985)}
.lead-btn .ic{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;
  box-shadow:0 3px 9px rgba(0,0,0,.35)}
.lead-btn .ic svg{width:19px;height:19px}
.lead-btn .tx{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.lead-btn .t1{font-size:9px;color:var(--muted);letter-spacing:.06em}
.lead-btn .t2{font-size:16px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-btn.tel .t2{color:#8fd0ff}
.lead-btn.mail .t2{font-size:14px;color:#ffd08a}
.lead-btn .go{margin-left:auto;color:#5f74a6}
.ic-tel{background:linear-gradient(135deg,#4a90ff,#2b5fd6)}
.ic-mail{background:linear-gradient(135deg,#ffb15e,#ff8a2b)}

.divide{height:1px;margin:0 2px 13px;background:linear-gradient(90deg,transparent,rgba(140,170,255,.28),transparent)}

.foot{text-align:center;margin-top:13px;font-family:var(--logo);font-weight:600;
  font-size:8.5px;letter-spacing:.28em;color:#7f92bd}
